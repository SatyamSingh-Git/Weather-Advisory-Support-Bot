# Kept as a PaaS alternative, with a caveat learned the hard way: Open-Meteo meters its free
# tier per IP per day, and a free-tier host shares an egress IP with other tenants. This
# deployment returned HTTP 429 on every request while the identical code worked elsewhere.
# The app caches and degrades to a recent reading, but a shared IP can still be spent before
# the first request. A host with its own IP avoids it entirely - see deploy/oracle-setup.sh.
services:
  - type: web
    name: weather-advisory-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: PYTHON_VERSION
        value: "3.12.7"
